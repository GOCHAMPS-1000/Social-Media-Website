<!-- social_media/core/templates/core/account_settings.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - SocialApp</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <div class="logo">SocialApp</div>
                <ul class="nav-links">
                    <li><a href="{% url 'post_feed' %}">Feed</a></li>
                    <li><a href="{% url 'upload_post' %}">Upload</a></li>
                    <li><a href="{% url 'search_user' %}">Search</a></li>
                    <li><a href="{% url 'notifications' %}">Notifications</a></li>
                    <li><a href="{% url 'profile' user.username %}">Profile</a></li>
                    <li><a href="{% url 'logout' %}">Logout</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="form-container">
                <h1>Account Settings</h1>
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" value="{{ form.username.value }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ form.email.value }}" required>
                    </div>
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" value="{{ form.first_name.value }}">
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" value="{{ form.last_name.value }}">
                    </div>
                    <button type="submit" class="btn">Save Changes</button>
                    <a href="{% url 'profile' user.username %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
