{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media App</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <div class="logo">SocialApp</div>
                <ul class="nav-links">
                    <li><a href="{% url 'signup' %}">Sign Up</a></li>
                    <li><a href="{% url 'signin' %}">Sign In</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="hero">
                <h1>Welcome to SocialApp</h1>
                <p>Connect with friends and share your life experiences.</p>
                <div class="cta-buttons">
                    <a href="{% url 'signup' %}" class="btn">Get Started</a>
                    <a href="{% url 'signin' %}" class="btn btn-secondary">Sign In</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
