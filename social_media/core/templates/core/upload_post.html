<!-- social_media/core/templates/core/upload_post.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Post - SocialApp</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <div class="logo">SocialApp</div>
                <ul class="nav-links">
                    <li><a href="{% url 'post_feed' %}">Feed</a></li>
                    <li><a href="{% url 'upload_post' %}">Upload</a></li>
                    <li><a href="{% url 'search_user' %}">Search</a></li>
                    <li><a href="{% url 'notifications' %}">Notifications</a></li>
                    <li><a href="{% url 'profile' user.username %}">Profile</a></li>
                    <li><a href="{% url 'logout' %}">Logout</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="form-container">
                <h1>Create a Post</h1>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="content">What's on your mind?</label>
                        <textarea id="content" name="content" rows="4" required>{{ form.content.value|default:'' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label for="image">Upload Image (optional)</label>
                        <input type="file" id="image" name="image" accept="image/*">
                    </div>
                    <button type="submit" class="btn">Post</button>
                    <a href="{% url 'post_feed' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
